<!DOCTYPE html>
<html lang="hu" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alsó végtag – Izomgyakorló</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1 class="brand-title">Alsó végtag – Izomgyakorló</h1>
        <span class="brand-stats" id="statsSummary">Megoldva: 0 · Átlag: 0%</span>
        <button type="button" class="btn-link" id="btnResetStats" title="Statisztika törlése">Nullázás</button>
      </div>

      <div class="topbar-controls">
        <div class="segmented" id="langSwitch" aria-label="Nyelv kiválasztása">
          <button type="button" data-val="both" class="active">Mindkettő</button>
          <button type="button" data-val="latin">Latin</button>
          <button type="button" data-val="hu">Magyar</button>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" id="btnOpenLexicon">Jegyzet</button>
        <button type="button" class="btn btn-secondary btn-sm" id="btnThemeToggle">Sötét mód</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="Gyakorlási szűrők és beállítások">
      <div class="toolbar-row">
        <div class="toolbar-group">
          <span class="toolbar-label">Csoportok</span>
          <div class="toggle-group" id="groupFilters"></div>
        </div>

        <div class="toolbar-group">
          <span class="toolbar-label">Kategóriák</span>
          <div class="toggle-group" id="categoryFilters"></div>
        </div>
      </div>

      <div class="toolbar-row toolbar-row-secondary">
        <div class="toolbar-group">
          <span class="toolbar-label">Sorrend</span>
          <div class="segmented" id="orderSwitch">
            <button type="button" data-val="random" class="active">Véletlenszerű</button>
            <button type="button" data-val="sequential">Sorrendben</button>
          </div>
        </div>

        <div class="toolbar-group toolbar-jump">
          <label class="toolbar-label" for="muscleJumpSelect">Ugrás izomhoz</label>
          <select id="muscleJumpSelect" class="select-input"></select>
        </div>

        <div class="toolbar-checks">
          <label class="check-item">
            <input type="checkbox" id="chkCountHint" />
            <span>Darabszám mutatása</span>
          </label>
          <label class="check-item" id="weakOnlyLabel" style="display:none;">
            <input type="checkbox" id="chkWeakOnly" />
            <span>Csak rontott izmok</span>
          </label>
        </div>
      </div>
    </section>

    <section class="exercise-card" id="exerciseCard">
      <div class="exercise-head">
        <div class="exercise-title-wrap">
          <div class="exercise-meta">
            <span class="meta-badge" id="progressBadge">1 / 47</span>
            <span class="meta-subgroup" id="muscleSubgroup"></span>
          </div>
          <h2 class="muscle-title" id="muscleTitle"></h2>
          <p class="muscle-subtitle" id="muscleSubtitle"></p>
        </div>

        <div class="exercise-nav">
          <button type="button" class="btn btn-secondary btn-sm" id="btnPrevMuscle">Előző</button>
          <button type="button" class="btn btn-secondary btn-sm" id="btnNextTop">Következő</button>
        </div>
      </div>

      <div class="categories-grid" id="categoriesContainer"></div>

      <div class="exercise-footer" id="exerciseFooter"></div>
    </section>
  </main>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="lexiconDrawer" aria-hidden="true">
    <div class="drawer-header">
      <h2>Alsó végtagi izmok jegyzete</h2>
      <button type="button" class="btn btn-secondary btn-sm" id="btnCloseLexicon">Bezárás</button>
    </div>
    <div class="drawer-filters">
      <input type="text" id="lexiconSearch" class="text-input" placeholder="Keresés (izom, eredés, tapadás, ideg)..." />
      <select id="lexiconGroupFilter" class="select-input">
        <option value="all">Minden csoport</option>
      </select>
    </div>
    <div class="drawer-body" id="lexiconBody"></div>
  </aside>

  <script defer src="data/lower_limb_muscles.js"></script>
  <script defer src="js/scoring.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
